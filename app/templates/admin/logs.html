{% extends 'admin/base.html' %}{% block content %}<section class="surface"><h2>200 thao tác gần nhất</h2><div class="table-scroll" tabindex="0" role="region" aria-label="Nhật ký thao tác"><table><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Chi tiết</th></tr></thead><tbody>{% for l in logs %}<tr><td class="nowrap">{{ l.created_at|localtime }}</td><td>{{ l.name or 'Hệ thống' }}</td><td>{{ l.action }}</td><td>{{ l.detail }}</td></tr>{% else %}<tr><td colspan="4" class="empty-cell">Chưa có thao tác.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
