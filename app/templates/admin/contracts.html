{% extends 'admin/base.html' %}
{% block content %}<form class="admin-search" action="/admin/contracts" data-live-form><div class="field"><label for="contract-status">Trạng thái</label><select id="contract-status" name="status"><option value="">Tất cả hợp đồng</option>{% for key,label in contract_statuses.items() %}<option value="{{ key }}" {% if key==selected_status %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><button class="button secondary" data-live-submit>Lọc</button></form><section class="surface"><h2>Hợp đồng theo đơn hàng</h2><p>Khách lập và xác nhận từ đơn hàng. Admin tra cứu, tải/in và ghi nhận hủy hiệu lực; không xác nhận thay khách.</p>{% include 'customer/contracts_table.html' %}</section>{% endblock %}
