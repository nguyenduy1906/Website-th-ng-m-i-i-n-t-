{% extends 'admin/base.html' %}{% from 'customer/macros.html' import order_table %}{% block content %}<section class="surface admin-list-section"><div class="section-heading"><h2>Danh sách đơn hàng</h2><span class="badge neutral">{{ orders|length }} kết quả</span></div><form class="admin-search" data-live-form action="/admin/orders"><label class="sr-only" for="orders-q">Tìm mã đơn / người nhận</label><input id="orders-q" name="q" value="{{ q }}" placeholder="Mã đơn hoặc người nhận"><label class="sr-only" for="filter-status">Trạng thái</label><select id="filter-status" name="status"><option value="">Tất cả trạng thái</option>{% for s in statuses %}<option value="{{ s }}" {% if s==selected_status %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><button class="button secondary" data-live-submit>Lọc đơn hàng</button></form>{{ order_table(orders,true) }}</section>{% endblock %}
