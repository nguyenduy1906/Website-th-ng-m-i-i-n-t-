<form action="/products" method="get" data-live-form><input type="hidden" name="sort" value="{{ sort }}"><div class="field"><label for="{{ filter_prefix }}-search">Từ khóa</label><input id="{{ filter_prefix }}-search" name="q" value="{{ q }}" maxlength="100" placeholder="Tên sản phẩm"></div><div class="field"><label for="{{ filter_prefix }}-category">Danh mục</label><select id="{{ filter_prefix }}-category" name="category"><option value="">Tất cả danh mục</option>{% for key,label in categories.items() %}<optgroup label="{{ label }}"><option value="{{ key }}" {% if key==category %}selected{% endif %}>Tất cả {{ label|lower }}</option>{% for child in category_tree.get(key,[]) %}<option value="{{ child.slug }}" {% if child.slug==category %}selected{% endif %}>{{ child.name }}</option>{% endfor %}</optgroup>{% endfor %}</select></div><div class="field"><label for="{{ filter_prefix }}-min">Giá từ (đồng)</label><input type="number" id="{{ filter_prefix }}-min" name="min_price" value="{{ min_price }}" min="0" max="1000000000" placeholder="0"></div><div class="field"><label for="{{ filter_prefix }}-max">Giá đến (đồng)</label><input type="number" id="{{ filter_prefix }}-max" name="max_price" value="{{ max_price }}" min="0" max="1000000000" placeholder="Không giới hạn"></div><div class="field"><label for="{{ filter_prefix }}-brand">Thương hiệu</label><select name="brand" id="{{ filter_prefix }}-brand"><option value="">Tất cả thương hiệu</option>{% for b in brands %}<option value="{{ b.id }}" {% if brand|string==b.id|string %}selected{% endif %}>{{ b.name }}</option>{% endfor %}</select></div><div class="field"><label for="{{ filter_prefix }}-rating">Đánh giá</label><select name="rating" id="{{ filter_prefix }}-rating"><option value="">Tất cả đánh giá</option>{% for n in [5,4,3] %}<option value="{{ n }}" {% if rating|string==n|string %}selected{% endif %}>Từ {{ n }} sao</option>{% endfor %}</select></div><div class="field"><label for="{{ filter_prefix }}-storage">Cấu hình / dung lượng</label><input name="storage" id="{{ filter_prefix }}-storage" value="{{ storage }}" maxlength="60" placeholder="Ví dụ: Tiêu chuẩn"></div><div class="field"><label for="{{ filter_prefix }}-color">Màu sắc</label><input name="color" id="{{ filter_prefix }}-color" value="{{ color }}" placeholder="Ví dụ: Xám, Xanh" maxlength="60"></div><div class="field"><label for="{{ filter_prefix }}-price-slider">Giá tối đa: <output data-price-output>{{ max_price or price_ceiling }}</output> ₫</label><input id="{{ filter_prefix }}-price-slider" type="range" min="0" max="{{ price_ceiling }}" step="100000" value="{{ max_price or price_ceiling }}" data-price-slider></div><button class="button full" data-live-submit>Áp dụng bộ lọc</button></form>
