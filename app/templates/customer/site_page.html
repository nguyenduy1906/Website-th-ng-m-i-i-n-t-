{% extends 'customer/base.html' %}
{% block content %}<nav class="breadcrumb" aria-label="Đường dẫn"><a href="/">Trang chủ</a><span>/</span><span>{{ page.title }}</span></nav><article class="surface portal-reading"><span class="eyebrow">NEU SHOP</span><h1>{{ page.title }}</h1><p class="portal-lead">{{ page.summary }}</p>{% if page.image %}<img class="page-cover" src="{{ page.image }}" alt="{{ page.title }}" width="1000" height="420">{% endif %}<div class="rich-content">{{ page.body|richtext }}</div><div class="portal-actions"><a class="button" href="/products">Khám phá sản phẩm</a><a class="button secondary" href="/contact">Liên hệ với chúng tôi</a></div></article>{% endblock %}
